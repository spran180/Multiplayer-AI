services:
  - type: web
    name: multiplayer-ai-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /tmp/state.sqlite3
      - key: REDIS_URL
        sync: false
      - key: LLM_PROVIDER
        value: auto
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: APPROVAL_QUORUM
        value: "2"
      - key: APPROVAL_TIMEOUT_SECONDS
        value: "300"
