[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiplayer-ai-agent"
version = "0.1.0"
description = "A shared, steerable AI agent runtime with versioned execution state."
requires-python = ">=3.9"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "httpx>=0.27,<1", "redis>=5,<7", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
include = ["backend*", "shared*"]

[tool.ruff]
line-length = 100
target-version = "py39"
